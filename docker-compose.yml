services:
  reservas:
    build:
      context: .
      dockerfile: reservas-service/Dockerfile
    environment:
      RESERVAS_DELAY_MS: "${RESERVAS_DELAY_MS:-0}"
    volumes:
      - reservas-data:/data
    ports:
      - "127.0.0.1:50051:50051"

  solicitudes:
    build:
      context: .
      dockerfile: solicitudes-service/Dockerfile
    environment:
      RESERVAS_TIMEOUT_S: "${RESERVAS_TIMEOUT_S:-2.0}"
      RETRY_AFTER_S: "5"
      JWT_SECRET: "${JWT_SECRET}"
      # Valores de demostración si no existe .env (solo desarrollo local)
      USUARIO_LECTURA: "${USUARIO_LECTURA:-lector}"
      CLAVE_LECTURA: "${CLAVE_LECTURA:-lector123}"
      USUARIO_ESCRITURA: "${USUARIO_ESCRITURA:-operador}"
      CLAVE_ESCRITURA: "${CLAVE_ESCRITURA:-operador123}"
    volumes:
      - solicitudes-data:/data
    ports:
      - "8080:8080"
    depends_on:
      reservas:
        condition: service_healthy

volumes:
  reservas-data:
  solicitudes-data: