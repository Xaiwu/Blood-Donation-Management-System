services:
  reservas:
    build:
      context: .
      dockerfile: reservas-service/Dockerfile
    environment:
      RESERVAS_DELAY_MS: "${RESERVAS_DELAY_MS:-0}"
    volumes:
      - reservas-data:/data

  solicitudes:
    build:
      context: .
      dockerfile: solicitudes-service/Dockerfile
    environment:
      RESERVAS_TIMEOUT_S: "${RESERVAS_TIMEOUT_S:-2.0}"
      RETRY_AFTER_S: "5"
      JWT_SECRET: "${JWT_SECRET}"
      USUARIO_LECTURA: "${USUARIO_LECTURA}"
      CLAVE_LECTURA: "${CLAVE_LECTURA}"
      USUARIO_ESCRITURA: "${USUARIO_ESCRITURA}"
      CLAVE_ESCRITURA: "${CLAVE_ESCRITURA}"
    volumes:
      - solicitudes-data:/data
    ports:
      - "8080:8080"
    depends_on:
      reservas:
        condition: service_healthy

volumes:
  reservas-data:
  solicitudes-data: